<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;background:#556}</style>
<script type="importmap">{"imports":{"three":"../lib/three.module.js"}}</script></head><body>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from '../lib/addons/loaders/GLTFLoader.js';
const q = new URLSearchParams(location.search);
const r = new THREE.WebGLRenderer({antialias:true}); r.setSize(innerWidth, innerHeight); document.body.appendChild(r.domElement); r.toneMapping = THREE.ACESFilmicToneMapping; r.outputColorSpace = THREE.SRGBColorSpace;
const s = new THREE.Scene(); s.add(new THREE.HemisphereLight('#fff','#666',1.5)); const d=new THREE.DirectionalLight('#fff',2); d.position.set(1,2,3); s.add(d);
const files = q.get('f').split(','); let x = 0;
const cam = new THREE.PerspectiveCamera(+(q.get('fov')||30), innerWidth/innerHeight, 0.01, 100);
let n=0;
for (const f of files) { new GLTFLoader().load(f, (g) => { const o=g.scene; o.position.x = (files.indexOf(f) - (files.length-1)/2) * (+(q.get('gap')||1.1)); o.rotation.y = +(q.get('rot')||0); s.add(o); if (++n===files.length) { const cy=+(q.get('cy')||0.5), cz=+(q.get('cz')||3); cam.position.set(0,cy,cz); cam.lookAt(0,cy,0); r.render(s,cam); document.title='done'; } }); }
</script></body></html>
